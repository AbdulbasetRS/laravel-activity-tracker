name: tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate composer.json
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --strict

  test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3]
        # Pin orchestra/testbench, NOT individual illuminate/* packages —
        # testbench versions map 1:1 to Laravel versions (^8=L10, ^9=L11,
        # ^10=L12) and Composer resolves every illuminate/* dependency
        # consistently from that one constraint. An earlier version of
        # this workflow pinned only "illuminate/support" to the matrix
        # version while leaving every OTHER illuminate/* package (database,
        # queue, routing, auth, http, validation, ...) unconstrained —
        # Composer could then resolve mismatched major versions across
        # different illuminate/* packages, which is never a valid Laravel
        # installation and could fail or silently misbehave.
        testbench: ["^8.0", "^9.0", "^10.0"]
        include:
          - testbench: "^8.0"
            laravel: "10.x"
          - testbench: "^9.0"
            laravel: "11.x"
          - testbench: "^10.0"
            laravel: "12.x"
        exclude:
          # Laravel 11/12 require PHP >= 8.2.
          - php: 8.1
            testbench: "^9.0"
          - php: 8.1
            testbench: "^10.0"

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, mbstring, json
          coverage: none

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --dev
          composer update --prefer-dist --no-interaction --no-progress --prefer-stable -W

      - name: Run test suite
        run: vendor/bin/phpunit

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run Pint (dry run)
        run: vendor/bin/pint --test

  package-discovery:
    needs: validate
    runs-on: ubuntu-latest
    name: Verify Laravel package auto-discovery
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: sqlite3, pdo_sqlite
          coverage: none

      # Feature/unit tests boot the package via Orchestra Testbench's
      # getPackageProviders(), which registers the ServiceProvider
      # explicitly — that never actually exercises composer.json's
      # "extra.laravel.providers" auto-discovery entry. A fresh Laravel
      # skeleton app that requires the package as a normal dependency (no
      # manual provider registration anywhere) is the only way to prove
      # discovery itself is correctly configured.
      - name: Create a throwaway Laravel application
        run: composer create-project laravel/laravel testbed --prefer-dist --no-interaction

      - name: Require the package from the local checkout
        working-directory: testbed
        run: |
          composer config repositories.local path ../package
          composer require abdulbaset/laravel-activity-tracker:@dev --no-interaction -W

      - name: Confirm the service provider was discovered
        working-directory: testbed
        run: |
          php artisan package:discover --ansi
          grep -q "Abdulbaset\\\\ActivityTracker\\\\ActivityTrackerServiceProvider" bootstrap/cache/packages.php

      - name: Confirm the dashboard routes are registered
        working-directory: testbed
        run: |
          touch database/database.sqlite
          php artisan migrate --force
          php artisan route:list --name=activity-tracker | grep -q "activity-tracker.dashboard"
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
